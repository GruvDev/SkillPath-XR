<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillPath-XR — Explainable Job Recommendation</title>
<style>
/* ===================================================================
   SkillPath-XR interface

   Design intent: this system's claim is that every sentence it writes
   is traceable to an edge in a knowledge graph. The interface is built
   to make that claim inspectable, so colour is used to encode
   truth-status rather than decoration:

     teal   = evidenced        amber = gap / unevidenced
     ink    = structure        slate = supporting detail

   Data identifiers (URIs, evidence ids, scores) are set in a monospace
   face throughout, because in this domain they are citations, not text.
   =================================================================== */

:root{
  --paper:#eef2f4;
  --raised:#ffffff;
  --ink:#0f1b24;
  --ink-soft:#33454f;
  --slate:#5f7480;
  --rule:#d2dde3;
  --rule-soft:#e3eaee;

  --verified:#0d6b6b;
  --verified-bg:#e2f0ef;
  --verified-line:#12a0a0;

  --gap:#a75c0b;
  --gap-bg:#fbeedd;
  --gap-line:#d98324;

  --exact:#0d6b6b;
  --narrower:#2b7a78;
  --broader:#5a7d8c;
  --related:#8a8f99;

  --font-ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-data:"SF Mono",ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;

  --r:4px;
  --shadow:0 1px 2px rgba(15,27,36,.06),0 6px 20px -12px rgba(15,27,36,.28);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verified-line);outline-offset:2px}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid var(--rule);
  background:var(--raised);
  position:sticky;top:0;z-index:50;
}
.masthead-inner{
  max-width:1400px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.wordmark{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.wordmark h1{
  font-size:19px;font-weight:650;letter-spacing:-.02em;margin:0;
}
.wordmark .xr{
  font-family:var(--font-data);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--verified);
  border:1px solid var(--verified-line);border-radius:2px;padding:1px 5px;
}
.wordmark p{
  margin:0;font-size:12.5px;color:var(--slate);
  border-left:1px solid var(--rule);padding-left:12px;
}
.providers{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-family:var(--font-data);font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--slate);
  background:var(--paper);border:1px solid var(--rule);
  border-radius:2px;padding:3px 7px;white-space:nowrap;
}
.chip b{color:var(--ink);font-weight:600}

/* ---------- layout ---------- */
.shell{max-width:1400px;margin:0 auto;padding:22px 24px 64px;
  display:grid;grid-template-columns:minmax(320px,388px) 1fr;gap:22px;align-items:start}
@media(max-width:1040px){.shell{grid-template-columns:1fr}}

.panel{
  background:var(--raised);border:1px solid var(--rule);
  border-radius:var(--r);box-shadow:var(--shadow);
}
.panel-head{
  padding:13px 16px;border-bottom:1px solid var(--rule-soft);
  display:flex;align-items:center;gap:10px;
}
.panel-head h2{
  margin:0;font-size:11px;font-family:var(--font-data);
  letter-spacing:.13em;text-transform:uppercase;color:var(--slate);font-weight:600;
}
.panel-body{padding:16px}

.sticky-col{position:sticky;top:78px}
@media(max-width:1040px){.sticky-col{position:static}}

/* ---------- input column ---------- */
.samples{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.sample{
  text-align:left;background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--r);padding:9px 11px;cursor:pointer;
  font-size:13px;color:var(--ink-soft);transition:border-color .12s,background .12s;
}
.sample:hover{border-color:var(--verified-line);background:var(--verified-bg)}
.sample b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.sample span{font-family:var(--font-data);font-size:10.5px;color:var(--slate)}

/* ---------- upload ---------- */
.tabs{display:flex;gap:2px;margin-bottom:11px;border-bottom:1px solid var(--rule)}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;
  padding:7px 12px;cursor:pointer;font-size:13px;color:var(--slate);
  font-weight:560;margin-bottom:-1px;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--verified);border-bottom-color:var(--verified-line)}

.dropzone{
  border:1.5px dashed var(--rule);border-radius:var(--r);
  padding:30px 18px;text-align:center;cursor:pointer;
  background:var(--paper);transition:border-color .14s,background .14s;
}
.dropzone:hover{border-color:var(--verified-line);background:var(--verified-bg)}
.dropzone.dragging{border-color:var(--verified-line);background:var(--verified-bg);border-style:solid}
.dropzone.busy{cursor:progress;opacity:.7}
.dz-icon{margin:0 auto 10px;display:block;color:var(--slate)}
.dropzone:hover .dz-icon,.dropzone.dragging .dz-icon{color:var(--verified)}
.dz-main{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:3px}
.dz-sub{font-family:var(--font-data);font-size:10.5px;color:var(--slate);letter-spacing:.03em}
.dz-warn{
  font-family:var(--font-data);font-size:10px;color:var(--gap);
  margin-top:7px;letter-spacing:.03em;
}

.filecard{
  display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
  padding:11px 13px;border:1px solid var(--verified-line);
  background:var(--verified-bg);border-radius:var(--r);margin-bottom:11px;
}
.filecard.err{border-color:var(--gap-line);background:var(--gap-bg)}
.filecard .fname{font-size:13.5px;font-weight:600;color:var(--ink);word-break:break-all}
.filecard .fmeta{font-family:var(--font-data);font-size:10.5px;color:var(--slate);margin-top:2px}
.filecard.err .fmeta{color:var(--gap)}
.filecard .fx{
  background:none;border:none;cursor:pointer;color:var(--slate);
  font-size:17px;line-height:1;padding:2px 5px;border-radius:2px;
}
.filecard .fx:hover{color:var(--gap);background:var(--raised)}

textarea{
  width:100%;min-height:230px;resize:vertical;
  border:1px solid var(--rule);border-radius:var(--r);
  padding:11px;background:var(--paper);
  font-family:var(--font-data);font-size:12.5px;line-height:1.6;
}
textarea:focus{background:var(--raised);border-color:var(--verified-line)}

.controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px}
.field label{
  font-family:var(--font-data);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--slate);
}
select,input[type=number]{
  border:1px solid var(--rule);border-radius:var(--r);
  padding:5px 7px;background:var(--raised);font-size:13px;
}
.btn{
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  border-radius:var(--r);padding:9px 16px;cursor:pointer;
  font-size:13.5px;font-weight:600;transition:opacity .12s;
}
.btn:hover{opacity:.87}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn-ghost:hover{border-color:var(--ink);opacity:1}

/* ---------- extracted skills ---------- */
.skill-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{
  font-family:var(--font-data);font-size:11px;
  background:var(--verified-bg);color:var(--verified);
  border:1px solid var(--verified-line);border-radius:2px;padding:2px 6px;
}
.tag.negated{
  background:var(--paper);color:var(--slate);border-color:var(--rule);
  text-decoration:line-through;
}

/* ---------- results ---------- */
.results-head{
  display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap;
}
.results-head h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.results-head .meta{font-family:var(--font-data);font-size:11.5px;color:var(--slate)}

.match{
  background:var(--raised);border:1px solid var(--rule);
  border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow);
  overflow:hidden;
}
.match.open{border-color:var(--verified-line)}

.match-head{
  display:grid;grid-template-columns:64px 1fr auto;gap:14px;
  padding:14px 16px;cursor:pointer;align-items:center;
}
.match-head:hover{background:var(--paper)}

/* score dial — the one bold element, reserved for the number that matters */
.dial{position:relative;width:64px;height:64px}
.dial svg{transform:rotate(-90deg)}
.dial-val{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-data);font-size:15px;font-weight:650;letter-spacing:-.03em;
}
.match-title h3{margin:0 0 2px;font-size:15.5px;font-weight:620;letter-spacing:-.01em}
.match-title .sub{font-size:12.5px;color:var(--slate)}
.match-title .sub code{font-family:var(--font-data);font-size:11px}
.match-flags{display:flex;flex-direction:column;align-items:flex-end;gap:5px}

.badge{
  font-family:var(--font-data);font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid;white-space:nowrap;
}
.badge.qualified{color:var(--verified);border-color:var(--verified-line);background:var(--verified-bg)}
.badge.near{color:var(--gap);border-color:var(--gap-line);background:var(--gap-bg)}
.badge.trust-high{color:var(--verified);border-color:var(--verified-line);background:transparent}
.badge.trust-moderate{color:var(--gap);border-color:var(--gap-line);background:transparent}
.badge.trust-low{color:var(--slate);border-color:var(--rule);background:transparent}

.match-body{border-top:1px solid var(--rule-soft);padding:0}
.section{padding:16px;border-bottom:1px solid var(--rule-soft)}
.section:last-child{border-bottom:none}
.section > h4{
  margin:0 0 11px;font-family:var(--font-data);font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--slate);font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.section > h4 .note{
  font-family:var(--font-ui);text-transform:none;letter-spacing:0;
  font-size:11.5px;color:var(--slate);font-weight:400;
}

/* ---------- SIGNATURE: citation-linked explanation ---------- */
.explanation{font-size:14.5px;line-height:1.72;color:var(--ink-soft)}
.sentence{
  border-bottom:1px dotted var(--rule);cursor:default;
  transition:background .12s;padding:1px 0;
}
.sentence.lit{background:var(--verified-bg);border-bottom-color:var(--verified-line)}
.sentence.ungrounded{background:var(--gap-bg);border-bottom-color:var(--gap-line)}
.cite{
  font-family:var(--font-data);font-size:10px;vertical-align:super;
  color:var(--verified);cursor:pointer;padding:0 1px;font-weight:600;
}
.cite:hover{text-decoration:underline}

.grounding{
  display:flex;align-items:center;gap:10px;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--rule-soft);
}
.meter{flex:1;height:5px;background:var(--rule-soft);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--verified-line);transition:width .4s}
.meter.low i{background:var(--gap-line)}
.grounding .label{font-family:var(--font-data);font-size:10.5px;color:var(--slate);white-space:nowrap}

/* ---------- evidence graph ---------- */
.graph-wrap{background:var(--paper);border:1px solid var(--rule-soft);border-radius:var(--r);overflow-x:auto}
.graph-wrap svg{display:block}
.edge{transition:stroke-width .15s,opacity .15s}
.edge.lit{stroke-width:3.2}
.edge.dim{opacity:.16}
.node-box{transition:opacity .15s}
.node-box.dim{opacity:.22}
.node-label{font-family:var(--font-ui);font-size:11.5px;fill:var(--ink)}
.node-sub{font-family:var(--font-data);font-size:9px;fill:var(--slate);letter-spacing:.06em}
.edge-tag{font-family:var(--font-data);font-size:8.5px;letter-spacing:.05em}
.col-head{font-family:var(--font-data);font-size:9.5px;letter-spacing:.12em;fill:var(--slate)}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px;font-family:var(--font-data);font-size:10px;color:var(--slate)}
.legend i{width:16px;height:2.5px;border-radius:2px;display:block}

/* ---------- score arithmetic ---------- */
table.arith{width:100%;border-collapse:collapse;font-size:13px}
table.arith th{
  text-align:left;font-family:var(--font-data);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--slate);
  font-weight:600;padding:0 8px 7px 0;border-bottom:1px solid var(--rule-soft);
}
table.arith td{padding:6px 8px 6px 0;border-bottom:1px solid var(--rule-soft)}
table.arith td.num{font-family:var(--font-data);text-align:right;font-size:12.5px}
table.arith tr:last-child td{border-bottom:none;font-weight:650;color:var(--ink)}
.bar{height:4px;background:var(--rule-soft);border-radius:2px;min-width:44px}
.bar i{display:block;height:100%;background:var(--verified);border-radius:2px}

/* ---------- SIGNATURE: counterfactual simulator ---------- */
.cf-intro{font-size:13.5px;color:var(--ink-soft);margin:0 0 12px}
.cf-grid{display:flex;flex-direction:column;gap:7px}
.cf-skill{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:9px 11px;background:var(--gap-bg);
  border:1px solid var(--gap-line);border-radius:var(--r);cursor:pointer;
  transition:background .12s,border-color .12s;
}
.cf-skill:hover{border-color:var(--gap)}
.cf-skill.on{background:var(--verified-bg);border-color:var(--verified-line)}
.cf-skill input{width:15px;height:15px;accent-color:var(--verified);cursor:pointer}
.cf-name{font-size:13.5px;font-weight:560}
.cf-meta{font-family:var(--font-data);font-size:10.5px;color:var(--slate)}
.cf-gain{font-family:var(--font-data);font-size:12px;font-weight:650;color:var(--gap)}
.cf-skill.on .cf-gain{color:var(--verified)}

.sim{
  margin-top:13px;padding:13px;border:1px solid var(--rule);
  border-radius:var(--r);background:var(--paper);
}
.sim-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sim-num{font-family:var(--font-data);font-size:23px;font-weight:650;letter-spacing:-.03em}
.sim-arrow{color:var(--slate);font-size:17px}
.sim-delta{font-family:var(--font-data);font-size:13px;font-weight:650}
.sim-delta.up{color:var(--verified)}
.track{
  position:relative;height:7px;background:var(--rule-soft);
  border-radius:4px;margin-top:11px;overflow:visible;
}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--verified-line);transition:width .45s cubic-bezier(.4,0,.2,1)}
.track .base{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--slate);opacity:.42}
.track .thr{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.track .thr::after{
  content:"threshold";position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  font-family:var(--font-data);font-size:8.5px;letter-spacing:.06em;color:var(--ink);white-space:nowrap;
}
.sim-verdict{
  margin-top:11px;font-size:13px;padding:8px 11px;border-radius:var(--r);
  border:1px solid var(--rule);background:var(--raised);color:var(--ink-soft);
}
.sim-verdict.crossed{border-color:var(--verified-line);background:var(--verified-bg);color:var(--verified);font-weight:560}

/* ---------- gaps ---------- */
.gap-list{display:flex;flex-wrap:wrap;gap:6px}
.gap-item{
  font-family:var(--font-data);font-size:11px;padding:3px 8px;border-radius:2px;
  background:var(--gap-bg);color:var(--gap);border:1px solid var(--gap-line);
}
.gap-item.optional{background:var(--paper);color:var(--slate);border-color:var(--rule)}

/* ---------- states ---------- */
.state{padding:52px 24px;text-align:center;color:var(--slate)}
.state h3{margin:0 0 7px;color:var(--ink);font-size:15.5px;font-weight:620}
.state p{margin:0;font-size:13.5px;max-width:460px;margin-inline:auto}
.state.error{color:var(--gap)}
.state.error h3{color:var(--gap)}
.spinner{
  width:26px;height:26px;margin:0 auto 14px;border-radius:50%;
  border:2.5px solid var(--rule);border-top-color:var(--verified-line);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="wordmark">
      <h1>SkillPath<span style="color:var(--slate)">·</span>XR</h1>
      <span class="xr">grounded</span>
      <p>Every sentence traces to a graph edge</p>
    </div>
    <div class="providers" id="providers"></div>
  </div>
</header>

<main class="shell">
  <!-- input -->
  <div class="panel sticky-col">
    <div class="panel-head"><h2>Candidate</h2></div>
    <div class="panel-body">
      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-upload" role="tab" aria-selected="true" aria-controls="pane-upload">Upload file</button>
        <button class="tab" id="tab-paste" role="tab" aria-selected="false" aria-controls="pane-paste">Paste text</button>
        <button class="tab" id="tab-sample" role="tab" aria-selected="false" aria-controls="pane-sample">Samples</button>
      </div>

      <div id="pane-upload" role="tabpanel" aria-labelledby="tab-upload">
        <div id="filecard-slot"></div>
        <div class="dropzone" id="dropzone" tabindex="0" role="button"
             aria-label="Upload a resume file. Drag and drop, or activate to browse.">
          <svg class="dz-icon" width="26" height="26" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <div class="dz-main">Drop a resume here</div>
          <div class="dz-sub" id="dz-formats">PDF · DOCX · ODT · RTF · TXT — max 10 MB</div>
          <div class="dz-warn" id="dz-warn" hidden></div>
        </div>
        <input type="file" id="filein" hidden
               accept=".pdf,.docx,.odt,.rtf,.txt,.md,application/pdf,text/plain">
      </div>

      <div id="pane-paste" role="tabpanel" aria-labelledby="tab-paste" hidden>
        <label class="sr" for="resume">Resume text</label>
        <textarea id="resume" placeholder="Paste a resume here."></textarea>
      </div>

      <div id="pane-sample" role="tabpanel" aria-labelledby="tab-sample" hidden>
        <div class="samples" id="samples"></div>
      </div>
      <div class="controls">
        <div class="field">
          <label for="mode">Retrieval</label>
          <select id="mode">
            <option value="hybrid">Hybrid</option>
            <option value="graph">Graph only</option>
            <option value="dense">Dense only</option>
          </select>
        </div>
        <div class="field">
          <label for="topk">Results</label>
          <input type="number" id="topk" value="6" min="1" max="20" style="width:60px">
        </div>
        <button class="btn" id="run">Find matches</button>
      </div>
      <div id="extracted" style="margin-top:14px"></div>
    </div>
  </div>

  <!-- results -->
  <div>
    <div class="results-head">
      <h2 id="results-title">Matches</h2>
      <span class="meta" id="results-meta"></span>
    </div>
    <div id="results">
      <div class="panel"><div class="state">
        <h3>No candidate loaded</h3>
        <p>Upload a resume file, paste text, or pick a sample. Each result
           opens to show the evidence behind its score.</p>
      </div></div>
    </div>
  </div>
</main>

<script>
"use strict";
/* =====================================================================
   State
   ===================================================================== */
const S = { resume:"", matches:[], threshold:0.62, open:null, sim:{}, file:null };
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s??"").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = n => (n*100).toFixed(0)+"%";
const f2  = n => Number(n).toFixed(2);

const REL_COLOR = { exact:"var(--exact)", narrower:"var(--narrower)",
                    broader:"var(--broader)", related:"var(--related)" };

async function api(path, body){
  const opt = body ? {method:"POST",headers:{"Content-Type":"application/json"},
                      body:JSON.stringify(body)} : {};
  const res = await fetch(path, opt);
  let data;
  try { data = await res.json(); }
  catch { throw new Error(`Server returned ${res.status} with an unreadable body.`); }
  if(!res.ok) throw new Error(data.error || `Request failed (${res.status}).`);
  return data;
}

/* =====================================================================
   Boot
   ===================================================================== */
async function boot(){
  try{
    const [health, samples] = await Promise.all([api("/api/health"), api("/api/samples")]);
    S.threshold = health.thresholds.qualification;
    const p = health.providers;
    $("#providers").innerHTML =
      [["graph",p.graph],["embed",p.embedder],["explain",p.generator]]
      .map(([k,v])=>`<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join("")
      + `<span class="chip">threshold <b>${f2(S.threshold)}</b></span>`;

    $("#samples").innerHTML = samples.samples.map((s,i)=>
      `<button class="sample" data-i="${i}">
         <b>${esc(s.name)}</b><span>${esc(s.candidate_id)}</span>
       </button>`).join("");
    $$("#samples .sample").forEach(btn=>btn.onclick=()=>{
      const s = samples.samples[+btn.dataset.i];
      $("#resume").value = s.text;
      clearFile();
      run();
    });

    // Ask the server which formats it can actually read, rather than
    // advertising PDF and failing after the user has waited for an upload.
    try{
      const f = await api("/api/upload/formats");
      if(!f.pdf_supported){
        $("#dz-formats").textContent = "DOCX · ODT · RTF · TXT — max 10 MB";
        const w = $("#dz-warn");
        w.textContent = "PDF unavailable on this server — install pdfplumber to enable it";
        w.hidden = false;
        $("#filein").setAttribute("accept",".docx,.odt,.rtf,.txt,.md");
      }
    }catch{ /* formats endpoint is advisory; the dropzone still works */ }
  }catch(e){
    $("#providers").innerHTML = `<span class="chip" style="color:var(--gap);border-color:var(--gap-line)">offline</span>`;
    showError("Could not reach the server", e.message);
  }
}

/* =====================================================================
   Tabs
   ===================================================================== */
const PANES = {"tab-upload":"pane-upload","tab-paste":"pane-paste","tab-sample":"pane-sample"};
function showTab(id){
  Object.entries(PANES).forEach(([tab,pane])=>{
    const on = tab===id;
    $("#"+tab).classList.toggle("active",on);
    $("#"+tab).setAttribute("aria-selected",String(on));
    $("#"+pane).hidden = !on;
  });
}
Object.keys(PANES).forEach(id=>{ $("#"+id).onclick=()=>showTab(id); });

/* =====================================================================
   File upload
   ===================================================================== */
function clearFile(){
  $("#filecard-slot").innerHTML = "";
  $("#filein").value = "";
  S.file = null;
}

function fileCard(name, meta, isError){
  const icon = isError
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--gap)" stroke-width="1.8"
         stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
         <line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--verified)" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
         <polyline points="14 2 14 8 20 8"/></svg>`;
  return `<div class="filecard${isError?" err":""}">
    ${icon}
    <div><div class="fname">${esc(name)}</div><div class="fmeta">${esc(meta)}</div></div>
    <button class="fx" id="file-clear" title="Remove file" aria-label="Remove file">&times;</button>
  </div>`;
}

async function uploadFile(file){
  if(!file) return;
  const dz = $("#dropzone");
  dz.classList.add("busy");
  $("#filecard-slot").innerHTML = fileCard(file.name, "Reading\u2026", false);
  $("#run").disabled = true;

  try{
    const form = new FormData();
    form.append("file", file, file.name);
    const res = await fetch("/api/upload", {method:"POST", body:form});
    let data;
    try{ data = await res.json(); }
    catch{ throw new Error(`Server returned ${res.status}.`); }

    if(!res.ok){
      $("#filecard-slot").innerHTML = fileCard(file.name, data.error || "Could not read this file", true);
      bindFileClear();
      return;
    }

    $("#resume").value = data.resume_text;
    S.file = data.filename;

    const bits = [data.format.toUpperCase(), `${data.chars.toLocaleString()} characters`];
    if(data.pages) bits.push(`${data.pages} page${data.pages===1?"":"s"}`);
    if(data.truncated) bits.push("truncated");
    if(data.warnings && data.warnings.length) bits.push(data.warnings[0]);

    $("#filecard-slot").innerHTML = fileCard(data.filename, bits.join(" \u00b7 "), false);
    bindFileClear();
    run();
  }catch(e){
    $("#filecard-slot").innerHTML = fileCard(file.name, e.message, true);
    bindFileClear();
  }finally{
    dz.classList.remove("busy");
    $("#run").disabled = false;
  }
}

function bindFileClear(){
  const btn = $("#file-clear");
  if(btn) btn.onclick = ()=>{ clearFile(); $("#resume").value=""; };
}

(function wireDropzone(){
  const dz = $("#dropzone"), input = $("#filein");
  dz.onclick = ()=>input.click();
  dz.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); input.click(); } };
  input.onchange = ()=>uploadFile(input.files[0]);

  ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev, e=>{
    e.preventDefault(); e.stopPropagation(); dz.classList.add("dragging");
  }));
  ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev, e=>{
    e.preventDefault(); e.stopPropagation();
    if(ev==="dragleave" && dz.contains(e.relatedTarget)) return;
    dz.classList.remove("dragging");
  }));
  dz.addEventListener("drop", e=>{
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) uploadFile(f);
  });

  // Dropping anywhere else must not make the browser navigate away from the app.
  ["dragover","drop"].forEach(ev=>window.addEventListener(ev, e=>e.preventDefault()));
})();

/* =====================================================================
   Run
   ===================================================================== */
async function run(){
  const text = $("#resume").value.trim();
  if(!text){ showError("No resume loaded","Upload a resume file, paste text, or pick a sample."); return; }

  S.resume = text; S.open = null; S.sim = {};
  $("#run").disabled = true;
  $("#results").innerHTML =
    `<div class="panel"><div class="state"><div class="spinner"></div>
     <h3>Matching</h3><p>Extracting skills, retrieving candidates and assembling evidence.</p></div></div>`;

  try{
    const data = await api("/api/recommend", {
      resume_text:text, top_k:+$("#topk").value || 6, mode:$("#mode").value
    });
    S.matches = data.matches; S.threshold = data.threshold ?? S.threshold;
    renderExtracted(data.candidate);
    renderResults(data);
  }catch(e){
    showError("Matching failed", e.message);
  }finally{
    $("#run").disabled = false;
  }
}

function showError(title,msg){
  $("#results").innerHTML =
    `<div class="panel"><div class="state error"><h3>${esc(title)}</h3><p>${esc(msg)}</p></div></div>`;
}

/* =====================================================================
   Extracted skills
   ===================================================================== */
function renderExtracted(c){
  const spans = c.spans.filter(s=>s.uri);
  if(!spans.length){ $("#extracted").innerHTML=""; return; }
  const seen = new Set(); const tags = [];
  for(const s of spans){
    if(seen.has(s.uri)) continue; seen.add(s.uri);
    tags.push(`<span class="tag${s.negated?" negated":""}" title="${esc(s.uri)}${s.negated?" — negated in source":""}">${esc(s.label)}</span>`);
  }
  const neg = spans.filter(s=>s.negated).length;
  $("#extracted").innerHTML =
    `<h4 style="margin:0 0 8px;font-family:var(--font-data);font-size:10.5px;
       letter-spacing:.13em;text-transform:uppercase;color:var(--slate)">
       Skills identified · ${seen.size}${neg?` · ${neg} negated`:""}</h4>
     <div class="skill-tags">${tags.join("")}</div>`;
}

/* =====================================================================
   Results
   ===================================================================== */
function renderResults(data){
  if(!data.matches.length){
    $("#results").innerHTML =
      `<div class="panel"><div class="state"><h3>No matches found</h3>
       <p>No job in the corpus shares enough skill evidence with this resume.</p></div></div>`;
    return;
  }
  const t = data.timings_ms || {};
  const total = Object.values(t).reduce((a,b)=>a+b,0);
  $("#results-meta").textContent =
    `${data.matches.length} results · ${total.toFixed(0)} ms · ${data.candidate.skill_uris.length} skills matched`;
  $("#results").innerHTML = data.matches.map((m,i)=>matchCard(m,i)).join("");
  bindMatches();
}

function matchCard(m,i){
  const q = m.qualified;
  const band = m.trust_band || "low";
  return `<article class="match" data-i="${i}" id="match-${i}">
    <div class="match-head" role="button" tabindex="0" aria-expanded="false" aria-controls="body-${i}">
      ${dial(m.score,q)}
      <div class="match-title">
        <h3>${esc(m.job.title)}</h3>
        <div class="sub">${esc(m.job.company)} · ${esc(m.job.location)} ·
          <code>${esc(m.job.seniority)}</code></div>
      </div>
      <div class="match-flags">
        <span class="badge ${q?"qualified":"near"}">${q?"qualified":"near miss"}</span>
        <span class="badge trust-${band}">trust ${band}</span>
      </div>
    </div>
    <div class="match-body" id="body-${i}" hidden></div>
  </article>`;
}

function dial(score,q){
  const r=27, c=2*Math.PI*r, on=Math.max(0,Math.min(1,score))*c;
  const col = q ? "var(--verified-line)" : "var(--gap-line)";
  return `<div class="dial">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--rule-soft)" stroke-width="5"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="${col}" stroke-width="5"
              stroke-linecap="round" stroke-dasharray="${on} ${c}"/>
    </svg>
    <span class="dial-val">${f2(score)}</span>
  </div>`;
}

function bindMatches(){
  $$(".match-head").forEach(head=>{
    const card = head.closest(".match");
    const i = +card.dataset.i;
    const toggle = ()=>{
      const body = $("#body-"+i);
      const open = !body.hidden;
      if(open){ body.hidden=true; card.classList.remove("open"); head.setAttribute("aria-expanded","false"); }
      else{
        body.innerHTML = detail(S.matches[i], i);
        body.hidden=false; card.classList.add("open");
        head.setAttribute("aria-expanded","true");
        bindDetail(i);
      }
    };
    head.onclick = toggle;
    head.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } };
  });
}

/* =====================================================================
   Detail: the auditable part
   ===================================================================== */
function detail(m,i){
  return [ explanationSection(m,i), graphSection(m,i),
           arithmeticSection(m), counterfactualSection(m,i), gapsSection(m) ]
         .filter(Boolean).join("");
}

/* --- explanation with citation chips (signature element) --- */
function explanationSection(m,i){
  const e = m.explanation;
  if(!e) return "";
  if(e.withheld){
    return `<div class="section"><h4>Explanation</h4>
      <div class="state error" style="padding:20px">
        <h3>Explanation withheld</h3><p>${esc(e.withheld_reason)}</p></div></div>`;
  }
  const v = e.validation || {grounding_rate:0,grounded_sentences:0,total_sentences:0};
  const sentences = (e.sentences||[]).map(s=>{
    const chips = (s.evidence_ids||[])
      .map(id=>`<span class="cite" data-ev="${esc(id)}" data-i="${i}" title="Highlight ${esc(id)} in the evidence graph">[${esc(id)}]</span>`)
      .join("");
    return `<span class="sentence${s.grounded?"":" ungrounded"}" data-ev-list="${esc((s.evidence_ids||[]).join(','))}" data-i="${i}">${esc(s.text)}</span>${chips} `;
  }).join("");

  const low = v.grounding_rate < 1 ? " low" : "";
  return `<div class="section">
    <h4>Explanation <span class="note">generated by ${esc(e.provider)} — hover a sentence to light its evidence</span></h4>
    <div class="explanation">${sentences}</div>
    <div class="grounding">
      <span class="label">grounding</span>
      <div class="meter${low}"><i style="width:${pct(v.grounding_rate)}"></i></div>
      <span class="label">${pct(v.grounding_rate)} · ${v.grounded_sentences}/${v.total_sentences} sentences verified against the graph</span>
    </div>
  </div>`;
}

/* --- evidence graph --- */
function graphSection(m,i){
  const ev = m.evidence||[];
  if(!ev.length) return `<div class="section"><h4>Evidence graph</h4>
    <p style="margin:0;color:var(--slate);font-size:13.5px">No evidence paths were found for this role.</p></div>`;

  const rowH=34, padT=42, padB=16, colL=16, boxW=190, gapX=150;
  const held=[], req=[], heldIdx={}, reqIdx={};
  ev.forEach(e=>{
    if(!(e.candidate_skill_uri in heldIdx)){ heldIdx[e.candidate_skill_uri]=held.length; held.push(e); }
    if(!(e.required_skill_uri in reqIdx)){ reqIdx[e.required_skill_uri]=req.length; req.push(e); }
  });
  const rows=Math.max(held.length,req.length);
  const H=padT+rows*rowH+padB, W=colL+boxW+gapX+boxW+colL;
  const yOf=n=>padT+n*rowH+rowH/2;

  const edges = ev.map(e=>{
    const y1=yOf(heldIdx[e.candidate_skill_uri]), y2=yOf(reqIdx[e.required_skill_uri]);
    const x1=colL+boxW, x2=colL+boxW+gapX, mx=(x1+x2)/2;
    const col=REL_COLOR[e.relation]||"var(--related)";
    const dash=e.relation==="exact"?"":'stroke-dasharray="4 3"';
    return `<g class="edge-group" data-ev="${esc(e.evidence_id)}">
      <path class="edge" data-ev="${esc(e.evidence_id)}"
        d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"
        fill="none" stroke="${col}" stroke-width="${1+e.strength*1.8}" ${dash} opacity="0.85"/>
      <text class="edge-tag" data-ev="${esc(e.evidence_id)}" x="${mx}" y="${(y1+y2)/2-4}"
        text-anchor="middle" fill="${col}">${esc(e.evidence_id)} ${esc(e.relation)}</text>
    </g>`;
  }).join("");

  const box=(e,side)=>{
    const isHeld=side==="held";
    const idx=isHeld?heldIdx[e.candidate_skill_uri]:reqIdx[e.required_skill_uri];
    const y=yOf(idx), x=isHeld?colL:colL+boxW+gapX;
    const label=isHeld?e.candidate_skill_label:e.required_skill_label;
    const sub=isHeld?"from resume":e.requirement_type;
    const stroke=isHeld?"var(--verified-line)":(e.requirement_type==="essential"?"var(--ink)":"var(--rule)");
    const fill=isHeld?"var(--verified-bg)":"var(--raised)";
    return `<g class="node-box" data-ev="${esc(e.evidence_id)}">
      <rect x="${x}" y="${y-13}" width="${boxW}" height="26" rx="3"
            fill="${fill}" stroke="${stroke}" stroke-width="1"/>
      <text class="node-label" x="${x+9}" y="${y-1}">${esc(trunc(label,24))}</text>
      <text class="node-sub" x="${x+9}" y="${y+9}">${esc(sub.toUpperCase())}</text>
    </g>`;
  };
  const heldBoxes=held.map(e=>box(e,"held")).join("");
  const reqBoxes=req.map(e=>box(e,"req")).join("");

  return `<div class="section">
    <h4>Evidence graph <span class="note">${ev.length} paths — each is one citable edge</span></h4>
    <div class="graph-wrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
      role="img" aria-label="Graph linking resume skills to job requirements" data-graph="${i}">
      <text class="col-head" x="${colL}" y="24">SKILLS FROM RESUME</text>
      <text class="col-head" x="${colL+boxW+gapX}" y="24">ROLE REQUIREMENTS</text>
      ${edges}${heldBoxes}${reqBoxes}
    </svg></div>
    <div class="legend">
      ${Object.entries(REL_COLOR).map(([k,v])=>
        `<span><i style="background:${v}"></i>${k}</span>`).join("")}
    </div>
  </div>`;
}
function trunc(s,n){ s=String(s); return s.length>n ? s.slice(0,n-1)+"…" : s; }

/* --- score arithmetic --- */
function arithmeticSection(m){
  const rows=m.score_arithmetic||[];
  if(!rows.length) return "";
  return `<div class="section">
    <h4>How the score was assembled</h4>
    <table class="arith">
      <thead><tr><th>Component</th><th style="text-align:right">Weight</th>
        <th style="text-align:right">Value</th><th style="text-align:right">Contribution</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td>${esc(r.component)}</td>
          <td class="num">${f2(r.weight)}</td>
          <td class="num">${f2(r.value)}</td>
          <td class="num">${f2(r.contribution)}</td>
          <td style="width:80px"><div class="bar"><i style="width:${pct(Math.min(1,r.contribution/0.6))}"></i></div></td>
        </tr>`).join("")}
        <tr><td>Final score</td><td class="num"></td><td class="num"></td>
            <td class="num">${f2(m.score)}</td><td></td></tr>
      </tbody>
    </table>
  </div>`;
}

/* --- counterfactual simulator (signature element) --- */
function counterfactualSection(m,i){
  const cf=m.counterfactual;
  if(!cf) return "";
  if(cf.achieves_threshold && !cf.skills.length){
    return `<div class="section"><h4>Skill gap</h4>
      <p class="cf-intro" style="margin:0">${esc(cf.note||"Already above the qualification threshold for this role.")}</p></div>`;
  }
  if(!cf.skills.length){
    return `<div class="section"><h4>Skill gap</h4>
      <p class="cf-intro" style="margin:0">${esc(cf.note||"No single skill set closes the gap for this role.")}</p></div>`;
  }
  const list=cf.skills.map(g=>`
    <label class="cf-skill" data-uri="${esc(g.skill_uri)}" data-i="${i}">
      <input type="checkbox" data-uri="${esc(g.skill_uri)}" data-i="${i}">
      <span>
        <span class="cf-name">${esc(g.skill_label)}</span><br>
        <span class="cf-meta">${esc(g.requirement_type)}${g.nearest_held_skill?` · closest you have: ${esc(g.nearest_held_skill)}`:""}</span>
      </span>
      <span class="cf-gain">+${f2(g.score_gain)}</span>
    </label>`).join("");

  return `<div class="section">
    <h4>What would close the gap <span class="note">tick a skill to recompute the match live</span></h4>
    <p class="cf-intro">Acquiring ${cf.skills.length===1?"this skill":`these ${cf.skills.length} skills`}
      would raise the match from <b>${f2(cf.baseline_score)}</b> to <b>${f2(cf.projected_score)}</b>${cf.achieves_threshold?", clearing the threshold":""}.
      ${cf.note?esc(cf.note):""}</p>
    <div class="cf-grid">${list}</div>
    <div class="sim" id="sim-${i}">
      <div class="sim-row">
        <span class="sim-num" id="sim-score-${i}">${f2(m.score)}</span>
        <span class="sim-arrow">→</span>
        <span class="sim-delta" id="sim-delta-${i}">no change</span>
      </div>
      <div class="track" id="track-${i}">
        <div class="base" style="width:${pct(m.score)}"></div>
        <div class="fill" style="width:${pct(m.score)}"></div>
        <div class="thr" style="left:${pct(S.threshold)}"></div>
      </div>
      <div class="sim-verdict" id="sim-verdict-${i}">Nothing selected — showing the current match.</div>
    </div>
  </div>`;
}

/* --- gaps --- */
function gapsSection(m){
  const g=m.gaps||[];
  if(!g.length) return "";
  return `<div class="section">
    <h4>Unevidenced requirements <span class="note">${g.length} of ${(m.job.essential_skills.length+m.job.optional_skills.length)}</span></h4>
    <div class="gap-list">${g.map(x=>
      `<span class="gap-item ${esc(x.requirement_type)}" title="${esc(x.requirement_type)}">${esc(x.skill_label)}</span>`
    ).join("")}</div>
  </div>`;
}

/* =====================================================================
   Detail interactions
   ===================================================================== */
function bindDetail(i){
  const body=$("#body-"+i);

  // citation <-> graph highlighting
  const lightUp = ids => {
    const svg=$(`svg[data-graph="${i}"]`,body); if(!svg) return;
    const set=new Set(ids.filter(Boolean));
    $$(".edge,.edge-tag,.node-box",svg).forEach(el=>{
      const ev=el.dataset.ev;
      el.classList.toggle("lit", set.size>0 && set.has(ev));
      el.classList.toggle("dim", set.size>0 && !set.has(ev));
    });
  };
  const clear = ()=>lightUp([]);

  $$(".sentence",body).forEach(s=>{
    s.onmouseenter=()=>{ s.classList.add("lit"); lightUp((s.dataset.evList||"").split(",")); };
    s.onmouseleave=()=>{ s.classList.remove("lit"); clear(); };
  });
  $$(".cite",body).forEach(c=>{
    c.onmouseenter=()=>lightUp([c.dataset.ev]);
    c.onmouseleave=clear;
    c.onclick=()=>{ lightUp([c.dataset.ev]); setTimeout(clear,1600); };
  });

  // counterfactual simulator
  $$('.cf-skill input',body).forEach(cb=>{
    cb.onchange=()=>{
      cb.closest(".cf-skill").classList.toggle("on",cb.checked);
      simulate(i);
    };
  });
}

async function simulate(i){
  const m=S.matches[i], body=$("#body-"+i);
  const picked=$$('.cf-skill input',body).filter(c=>c.checked).map(c=>c.dataset.uri);
  const scoreEl=$("#sim-score-"+i), deltaEl=$("#sim-delta-"+i),
        verdictEl=$("#sim-verdict-"+i), fill=$("#track-"+i+" .fill");

  if(!picked.length){
    scoreEl.textContent=f2(m.score);
    deltaEl.textContent="no change"; deltaEl.className="sim-delta";
    fill.style.width=pct(m.score);
    verdictEl.textContent="Nothing selected — showing the current match.";
    verdictEl.className="sim-verdict";
    return;
  }

  verdictEl.textContent="Recomputing…";
  try{
    const r=await api("/api/simulate",
      {resume_text:S.resume, job_id:m.job.job_id, added_skills:picked});
    const after=r.after.score;
    scoreEl.textContent=f2(after);
    deltaEl.textContent=(r.delta>=0?"+":"")+f2(r.delta);
    deltaEl.className="sim-delta"+(r.delta>0?" up":"");
    fill.style.width=pct(after);

    const names=r.added_skills.map(s=>s.label).join(", ");
    if(r.after.qualified && r.crossed_threshold){
      verdictEl.textContent=`Adding ${names} clears the ${f2(r.threshold)} threshold — this becomes a qualified match.`;
      verdictEl.className="sim-verdict crossed";
    }else if(r.after.qualified){
      verdictEl.textContent=`Still qualified at ${f2(after)} with ${names} added.`;
      verdictEl.className="sim-verdict crossed";
    }else{
      const short=(r.threshold-after).toFixed(2);
      verdictEl.textContent=`Adding ${names} reaches ${f2(after)} — still ${short} below the threshold.`;
      verdictEl.className="sim-verdict";
    }
  }catch(e){
    verdictEl.textContent="Could not recompute: "+e.message;
    verdictEl.className="sim-verdict";
  }
}

/* =====================================================================
   Wire up
   ===================================================================== */
$("#run").onclick=run;
$("#resume").addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter") run();
});
boot();
</script>
</body>
